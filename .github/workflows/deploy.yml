name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/workout-tracker-app-8b5f9d, claude/liift-more-app-redesign-krnvua]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch. This used to be a single shared `pages` group, which
# meant pushing the same commit to several branches at once made the runs
# cancel each other -- and the survivor was often a branch that cannot
# deploy, so the live site silently went stale. Per-branch groups keep the
# default branch's run safe from the others. Only one branch ever reaches the
# deploy job (see its `if`), so Pages still only gets one deployment at a time.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NOTE: GitHub Pages must be enabled once by the repo owner:
      # Settings → Pages → Build and deployment → Source → "GitHub Actions".
      # Auto-enable isn't possible here (the token can't create the Pages site).
      - run: npm ci

      # Build with the base path matching the repo name so assets resolve
      # correctly on https://<user>.github.io/<repo>/.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # SPA fallback so deep links / refreshes don't 404 on Pages.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The github-pages environment only permits deploys from the repo's DEFAULT
  # branch, so every other branch stops after `build` (which still works as a
  # type-check + build check). This compares against the default branch at run
  # time rather than hard-coding a name, so changing the default in Settings is
  # all it takes -- no edit here.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
