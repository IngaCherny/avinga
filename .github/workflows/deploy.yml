name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Turn GitHub Pages on (with "GitHub Actions" as the source) if it isn't
      # already, using the workflow's own token. Avoids a manual settings click.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Build with the base path matching the repo name so assets resolve
      # correctly on https://<user>.github.io/<repo>/.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # SPA fallback so deep links / refreshes don't 404 on Pages.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
